<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoList</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
    }
    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .add-btn {
      background: #2ecc9b;
      color: white;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .delete-btn {
      background: #e74c3c;
      color: white;
    }
    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Ma ToDoList</h1>

  <div class="form">
    <input type="text" id="itemName" placeholder="Nom de l'item">
    <button class="add-btn" onclick="addItem()">Ajouter</button>
  </div>

  <p class="error" id="error"></p>

  <ul id="list"></ul>

  <script>
    const MAX_ITEMS = 10;
    let items = [];

    function addItem() {
      const input = document.getElementById("itemName");
      const error = document.getElementById("error");
      const name = input.value.trim();
      error.textContent = "";

      if (!name) {
        error.textContent = "Le nom ne peut pas être vide";
        return;
      }
      if (items.length >= MAX_ITEMS) {
        error.textContent = "La ToDoList est pleine (maximum 10 items)";
        return;
      }
      if (items.find(i => i.name === name)) {
        error.textContent = "Un item avec ce nom existe déjà";
        return;
      }

      items.push({ name });
      input.value = "";
      render();
    }

    function deleteItem(index) {
      items.splice(index, 1);
      render();
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      items.forEach((item, index) => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = item.name;
        const btn = document.createElement("button");
        btn.className = "delete-btn";
        btn.textContent = "Supprimer";
        btn.onclick = () => deleteItem(index);
        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
